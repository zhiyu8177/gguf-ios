name: GGUFApp
options:
  bundleIdPrefix: com.gguf
  deploymentTarget:
    iOS: "14.0"
targets:
  GGUFApp:
    type: application
    platform: iOS
    sources:
      - path: WujiApp.swift
      - path: index.html
      - path: Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gguf.workbench
        PRODUCT_NAME: GGUFApp
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
  GGUFTest:
    type: application
    platform: iOS
    sources:
      - path: GGUFTest
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gguf.test
        PRODUCT_NAME: GGUFTest
        INFOPLIST_FILE: GGUFTest/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
