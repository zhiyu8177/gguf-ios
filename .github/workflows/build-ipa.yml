name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned 2.42.0, same as Shiyi)
        run: |
          set -e
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo mv /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # 兜底：若仍是 Xcode16 格式(77)，降到 Xcode15 可读的 56
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' GGUFApp.xcodeproj/project.pbxproj || true

      - name: Build for device (unsigned, TrollStore)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GGUFApp.xcodeproj \
            -scheme GGUFApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="-ld_classic" \
            | tee xcodebuild.log
          tail -20 xcodebuild.log

      - name: Create IPA
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r GGUFApp.app Payload/
          zip -r ../../../../GGUFApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GGUFApp-ipa
          path: GGUFApp.ipa

      - name: Upload IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=v$(date +%s)
          gh release create "$TAG" GGUFApp.ipa --title "GGUFApp build" --notes "Auto build $(date)" --repo zhiyu8177/gguf-ios
          echo "RELEASE_TAG=$TAG"
