<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AgentShell 遥控</title>
<style>
:root{--bg:#04070f;--panel:#0b1322;--line:#12283d;--cyan:#00c8ff;--blue:#1a6dff;--text:#d7ecff;--dim:#6f93b8;--faint:#3c5a78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:radial-gradient(1200px 700px at 70% -10%,#0a1a30 0%,#050b16 55%,#03060d 100%);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(5,11,22,.9)}
.topbar .ttl{font-size:15px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#7fdcff,#1a6dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.dot.ok{background:#35e0a1;box-shadow:0 0 6px #35e0a1}
.dot.bad{background:#ff6b81}
.stat{font-size:10px;color:var(--dim);margin-left:auto;font-family:Consolas,monospace}
.chat{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin-bottom:14px;animation:msgin .35s cubic-bezier(.2,.8,.3,1.1)}
.msg.user{justify-content:flex-end}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.bubble{max-width:84%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:linear-gradient(180deg,rgba(13,26,46,.92),rgba(9,18,34,.92));border:1px solid var(--line);border-left:2px solid var(--cyan);border-bottom-left-radius:4px}
.msg.user .bubble{background:linear-gradient(135deg,#0e2a4a,#0a1a30);border:1px solid #1e4468;border-bottom-right-radius:4px}
.bubble.streaming:after{content:'▍';color:var(--cyan);animation:blink .8s infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.sysb{text-align:center;color:var(--faint);font-size:11.5px;margin:8px 0;font-family:Consolas,monospace}
.msg.sys{justify-content:center}
.msg.sys .bubble{background:none;border:none;color:var(--faint);font-size:11.5px;max-width:100%;font-family:Consolas,monospace}
.inputbar{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(5,11,22,.95)}
#inp{flex:1;background:#081222;border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:var(--text);font-size:15px;outline:none}
#inp:focus{border-color:var(--cyan)}
.cbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#0a1424;color:var(--dim);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn:active{transform:scale(.94)}
#sendBtn{border-color:var(--blue);color:var(--cyan)}
#micBtn.rec{color:#ff6b81;border-color:#ff6b81;animation:recp 1s infinite}
#micBtn.on{color:var(--cyan);border-color:var(--blue);background:#0c2036}
@keyframes recp{50%{box-shadow:0 0 12px rgba(255,107,129,.5)}}
/* 语音模式的实心条：点喇叭后输入框变成这条，按住说话 */
#holdBar{flex:1;height:44px;display:none;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:linear-gradient(180deg,#12314e,#0b1e33);border:1px solid #1e4468;border-radius:22px;
  color:#cfe6ff;font-size:15px;letter-spacing:3px;font-weight:500;
  box-shadow:inset 0 1px 0 rgba(120,200,255,.12);transition:background .12s,box-shadow .12s,color .12s}
#holdBar.rec{background:linear-gradient(180deg,#3d1424,#25101b);border-color:#ff6b81;color:#ffb3c1;
  box-shadow:0 0 16px rgba(255,107,129,.45),inset 0 1px 0 rgba(255,160,180,.2)}
#holdBar.rec .wave{display:inline-flex}
#holdBar .wave{display:none;align-items:flex-end;gap:2px;margin-left:8px;height:14px}
#holdBar .wave i{width:2px;background:#ff8fa3;border-radius:1px;animation:wv .9s infinite ease-in-out}
#holdBar .wave i:nth-child(2){animation-delay:.15s}
#holdBar .wave i:nth-child(3){animation-delay:.3s}
#holdBar .wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
#ttsFloat{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:rgba(8,17,32,.94);color:var(--dim);z-index:60;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#ttsFloat.on{color:var(--cyan);border-color:var(--blue);box-shadow:0 0 14px rgba(0,200,255,.4)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(9,20,36,.95);border:1px solid var(--line);color:var(--cyan);font-size:12px;padding:8px 16px;border-radius:18px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:70;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <span class="ttl">AgentShell 遥控 <em style="font-size:11px;color:#8e8e93;font-style:normal">v1.2.3</em></span>
  <span class="stat"><span class="dot bad" id="dotE"></span>引擎 <span class="dot bad" id="dotT"></span>语音</span>
</div>
<div class="chat" id="chat">
  <div class="sysb">[ 手机通道已连接 · 本地推理 · 零Token消耗 ]</div>
</div>
<div class="inputbar">
  <button class="cbtn" id="micBtn" title="语音输入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></button>
  <input id="inp" placeholder="说点什么..." autocomplete="off">
  <div id="holdBar"><span id="holdTxt">按住 说话</span><span class="wave"><i></i><i></i><i></i><i></i></span></div>
  <button class="cbtn" id="sendBtn" title="发送"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg></button>
</div>
<button id="ttsFloat" title="自动朗读开关"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>
<div id="toast"></div>
<script>
/* ===== 服务地址 =====
   默认蒲公英 IP + AgentShell 8099；地址存原生 UserDefaults（重启保留）。
   浏览器环境退回 localStorage（try/catch 兜底）。 */
var DEFAULT_SERVER='http://172.16.2.103:8099';
var SERVER_IP=DEFAULT_SERVER,TOKEN='';
try{SERVER_IP=(localStorage.getItem('gguf_ip')||'').trim()||DEFAULT_SERVER;TOKEN=(localStorage.getItem('gguf_token')||'').trim();}catch(e){}
var API=SERVER_IP;

function askServer(){
  var s=window.prompt('电脑地址（含端口）',SERVER_IP);
  if(!s)return false;
  s=s.trim();if(!s)return false;
  SERVER_IP=s;API=s;
  try{localStorage.setItem('gguf_ip',s)}catch(e){}
  if(hasBridge())callNative('setServer',{server:s});
  return true;
}
function askToken(){
  var t=window.prompt('粘贴电脑端的连接码（如有）','');
  if(!t)return false;
  TOKEN=t.trim();try{localStorage.setItem('gguf_token',TOKEN)}catch(e){}
  return true;
}

/* ===== 原生桥层（手册约定：有原生走原生，fetch 兜底） ===== */
var _seq=0,_cbs={};
window.WJ={_cb:function(id,ok,payload){var f=_cbs[id];delete _cbs[id];if(f)f(ok,payload)}};
function hasBridge(){return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.api)}
function callNative(action,params){
  return new Promise(function(res){
    var id='c'+(++_seq);_cbs[id]=function(ok,p){res({ok:ok,data:p})};
    var m={action:action,id:id};if(params)for(var k in params)m[k]=params[k];
    window.webkit.messageHandlers.api.postMessage(m);
  });
}

var chat=document.getElementById('chat'),inp=document.getElementById('inp');
/* 注意：不能用 history 做变量名——window.history 是不可写属性，var 覆盖无效，
   后续 history.slice() 会抛 TypeError 让第一条消息永久卡死 */
var hist=[],autoRead=true,curAudio=null,busy=false,nativePlaying=false;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2200)}
function scrollEnd(){chat.scrollTop=chat.scrollHeight}
function addMsg(role,text){
  var d=document.createElement('div');d.className='msg '+role;
  var b=document.createElement('div');b.className='bubble';b.textContent=text;
  d.appendChild(b);chat.appendChild(d);scrollEnd();return b;
}

/* ===== TTS：原生桥优先（AVAudioPlayer 可停），fetch 兜底 ===== */
function stopSpeak(){
  if(nativePlaying){callNative('ttsStop');nativePlaying=false}
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
}
function speak(text){
  if(!text)return;
  stopSpeak();
  if(hasBridge()){
    nativePlaying=true;
    callNative('tts',{text:text,server:API}).then(function(r){
      nativePlaying=false;
      if(!r.ok)toast('语音服务未启动');
    });
    return;
  }
  fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:JSON.stringify({text:text})})
  .then(function(r){if(!r.ok)throw 0;return r.blob()})
  .then(function(blob){curAudio=new Audio(URL.createObjectURL(blob));curAudio.play();curAudio.onended=function(){curAudio=null}})
  .catch(function(){toast('语音服务未启动')});
}
document.getElementById('ttsFloat').addEventListener('click',function(){
  if(curAudio||nativePlaying){stopSpeak();return}
  autoRead=!autoRead;this.classList.toggle('on',autoRead);
  toast(autoRead?'语音朗读 已开启':'语音朗读 已关闭');
  if(autoRead){var bs=chat.querySelectorAll('.msg.ai .bubble');if(bs.length)speak(bs[bs.length-1].textContent)}
});

/* ===== 流式对话 =====
   按 \n\n 切帧并保留半帧：直接对每个 TCP 块 split('\n') 会把被拆开的一帧
   解析失败后静默丢弃，长回答会丢字。 */
function send(){
  var text=inp.value.trim();if(!text||busy)return;
  inp.value='';busy=true;
  addMsg('user',text);
  var bub=addMsg('ai','');bub.classList.add('streaming');
  hist.push({role:'user',content:text});
  if(hist.length>24)hist=hist.slice(-24);

  var acc='',buf='',demo=false;

  function feed(str){
    buf+=str;
    var frames=buf.split('\n\n');
    buf=frames.pop();
    for(var i=0;i<frames.length;i++){
      var lines=frames[i].split('\n');
      for(var j=0;j<lines.length;j++){
        var l=lines[j];
        if(l.indexOf('data:')!==0)continue;
        var d=l.slice(5).trim();
        if(!d||d==='[DONE]')continue;
        try{
          var o=JSON.parse(d);
          if(o.delta){acc+=o.delta;bub.textContent=acc;scrollEnd()}
          if(o.meta&&o.meta.demo)demo=true;
        }catch(e){}
      }
    }
  }

  function end(){
    bub.classList.remove('streaming');
    if(demo)toast('演示模式：引擎未启动，以上不是模型输出');
    if(acc){hist.push({role:'assistant',content:acc});hist=hist.slice(-24)}
    if(autoRead&&acc)speak(acc);
    busy=false;
  }

  fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},
    body:JSON.stringify({text:text,messages:hist.slice(0,-1)})})
  .then(function(r){
    if(r.status===401){askToken();throw new Error('连接码已更新，请重发');}
    if(r.status===429)throw new Error('引擎正在处理上一轮，等几秒再发');
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(!r.body||!r.body.getReader)throw new Error('当前环境不支持流式读取');
    var reader=r.body.getReader(),dec=new TextDecoder();
    function pump(){
      return reader.read().then(function(res){
        if(res.done){if(buf)feed('\n\n');return}
        feed(dec.decode(res.value,{stream:true}));
        return pump();
      });
    }
    return pump();
  })
  .then(end)
  .catch(function(e){
    bub.classList.remove('streaming');
    if(!acc)bub.textContent='[ 连接失败：请确认电脑端服务已启动 ]';
    else toast('连接中断');
    busy=false;
  });
}
document.getElementById('sendBtn').addEventListener('click',send);
inp.addEventListener('keydown',function(e){if(e.key==='Enter')send()});

/* ===== 语音：点喇叭 → 输入框变实心「按住 说话」条 → 按住说，松手自动发送 =====
   交互对齐微信：喇叭是模式开关；说话必须按在实心条上，不是按喇叭本身 */
var micBtn=document.getElementById('micBtn'),
    holdBar=document.getElementById('holdBar'),
    holdTxt=document.getElementById('holdTxt'),
    voiceMode=false,recording=false,recT0=0,startP=null,startOK=false,hintShown=false;

var MIC_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>';
var KB_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>';

function setVoiceMode(on){
  voiceMode=on;recording=false;
  holdBar.classList.remove('rec');holdTxt.textContent='按住 说话';
  inp.style.display=on?'none':'';
  holdBar.style.display=on?'flex':'none';
  document.getElementById('sendBtn').style.display=on?'none':'';
  micBtn.innerHTML=on?KB_SVG:MIC_SVG;
  micBtn.classList.toggle('on',on);
  if(on){try{inp.blur()}catch(e){}
    if(!hintShown){hintShown=true;toast('按住实心条说话，松手自动发送')}}
}
micBtn.addEventListener('click',function(e){
  e.preventDefault();
  if(recording)return;
  setVoiceMode(!voiceMode);
});

function holdStart(e){
  if(e)e.preventDefault();
  if(recording||busy||!voiceMode)return;
  recording=true;startOK=false;startP=null;recT0=Date.now();
  holdBar.classList.add('rec');holdTxt.textContent='松开 发送';
  if(hasBridge()){
    startP=callNative('recStart').then(function(r){
      startOK=!!r.ok;
      if(!r.ok)toast('无法录音：'+((r.data&&r.data.error)||'检查麦克风/语音识别权限'));
      return startOK;
    });
  }
}
function holdEnd(e){
  if(e)e.preventDefault();
  if(!recording)return;
  recording=false;
  holdBar.classList.remove('rec');holdTxt.textContent='按住 说话';
  var dur=Date.now()-recT0;
  if(!hasBridge())return;              // 浏览器分支自己在 bStop 里处理停止
  Promise.resolve(startP).then(function(ok){
    if(!ok)return;
    if(dur<600){callNative('recStop');toast('按住说话，别松太快');return}
    toast('识别中...');
    return callNative('recStop').then(function(r){
      var t=r.ok&&r.data&&r.data.text;
      if(!t){toast('没听清，再说一次');return}
      if(busy){inp.value=t;setVoiceMode(false);toast('上一轮还没答完，先填进输入框');return}
      inp.value=t;send();
    });
  });
}

if(hasBridge()){
  holdBar.addEventListener('touchstart',holdStart,{passive:false});
  holdBar.addEventListener('touchend',holdEnd);
  holdBar.addEventListener('touchcancel',holdEnd);
  holdBar.addEventListener('mousedown',holdStart);
  holdBar.addEventListener('mouseup',holdEnd);
  holdBar.addEventListener('contextmenu',function(e){e.preventDefault()});
}else{
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBtn.style.display='none'}
  else{
    var brec=null;
    function bReset(){holdBar.classList.remove('rec');holdTxt.textContent='按住 说话'}
    function bStart(e){
      if(e)e.preventDefault();
      if(brec)return;
      brec=new SR();brec.lang='zh-CN';brec.interimResults=false;
      brec.onresult=function(ev){var t=ev.results[0][0].transcript;if(t){inp.value=t;send()}};
      brec.onend=function(){brec=null;bReset()};
      brec.onerror=function(){bReset();toast('没听清，再说一次')};
      try{brec.start();holdBar.classList.add('rec');holdTxt.textContent='松开 发送'}catch(err){brec=null}
    }
    function bStop(e){
      if(e)e.preventDefault();
      if(!brec)return;
      try{brec.stop()}catch(err){}
    }
    holdBar.addEventListener('touchstart',bStart,{passive:false});
    holdBar.addEventListener('touchend',bStop);
    holdBar.addEventListener('touchcancel',bStop);
    holdBar.addEventListener('mousedown',bStart);
    holdBar.addEventListener('mouseup',bStop);
    holdBar.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
}

/* ===== 状态轮询（/health 返回 engine=online/standby；连不上引导改地址） ===== */
/* v1.2.2：存的旧地址（可能是以前连 GGUF 8000 留下的）连不上时，自动切回默认地址重试，
   不再死等；默认地址也失败才提示（大概率是 iOS 本地网络权限没给） */
function useDefault(msg){
  SERVER_IP=DEFAULT_SERVER;API=DEFAULT_SERVER;
  try{localStorage.setItem('gguf_ip',DEFAULT_SERVER)}catch(e){}
  if(hasBridge())callNative('setServer',{server:DEFAULT_SERVER});
  addMsg('sys',msg);
  health();
}
function health(){
  if(hasBridge()){
    callNative('health',{server:API}).then(function(r){
      if(r.ok){
        window._askedServer=false;
        var h=(typeof r.data==='string')?(function(){try{return JSON.parse(r.data)}catch(e){return {}}})():r.data;
        var e=h.engine==='online'||h.engine==='standby';
        document.getElementById('dotE').className='dot '+(e?'ok':'bad');
        document.getElementById('dotT').className='dot '+(h.tts?'ok':'bad');
      }else if(API!==DEFAULT_SERVER){
        window._askedServer=true;
        useDefault('[ 旧地址 '+API+' 连不上，已切回默认地址 ]');
      }else if(!window._askedServer){
        window._askedServer=true;
        addMsg('sys','[ 连不上 '+API+' · 检查电脑端 AgentShell 是否开着，或到 设置→隐私与安全性→本地网络 打开 GGUF 的开关 ]');
        if(askServer()){toast('地址已更新，正在重连');health()}
      }else{
        document.getElementById('dotE').className='dot bad';
        document.getElementById('dotT').className='dot bad';
      }
    });
    return;
  }
  fetch(API+'/health').then(function(r){return r.json()}).then(function(h){
    window._askedServer=false;
    var e=h.engine==='online'||h.engine==='standby';
    document.getElementById('dotE').className='dot '+(e?'ok':'bad');
    document.getElementById('dotT').className='dot '+(h.tts?'ok':'bad');
  }).catch(function(){
    if(API!==DEFAULT_SERVER){window._askedServer=true;useDefault('[ 旧地址 '+API+' 连不上，已切回默认地址 ]');return}
    /* 地址不对就一直白屏，看不出原因——失败时给一次改的机会 */
    if(location.protocol==='file:'&&!window._askedServer){
      window._askedServer=true;
      addMsg('sys','[ 连不上 '+API+' · 检查电脑端 AgentShell 是否开着，或到 设置→隐私与安全性→本地网络 打开 GGUF 的开关 ]');
      if(askServer()){toast('地址已更新，正在重连');health()}
    }
  });
}
/* 启动时先用原生存的地址覆盖（UserDefaults 比 localStorage 可靠） */
if(hasBridge()){
  callNative('getServer').then(function(r){
    if(r.ok&&r.data){try{var o=JSON.parse(r.data);if(o.server){SERVER_IP=o.server;API=o.server}}catch(e){}}
    health();
  });
}else{
  health();
}
setInterval(health,10000);
</script>
</body>
</html>
